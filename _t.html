<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCNA Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study: clear, bright, calm working parts
   IDEA a metro map of a network: each exam domain is a coloured line, each lesson a station
   PICTURE the network topology drawn as a transit diagram, stations ringed by progress
   COLOUR white / night #0e1116, ink, line colours per domain, red only for mistakes
   TYPE Figtree 800 display + Figtree / system Japanese text
   LAYOUT map on top (left on wide screens), next-station card and line list beside/below; bottom tab bar */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1116);--ink:light-dark(#121418,#eef1f5);--sub:light-dark(#5a626e,#9aa4b2);--line:light-dark(#e2e5ea,#272c35);--soft:light-dark(#f3f5f8,#171b22);--card:light-dark(#ffffff,#141820);--ok:#00a05a;--ng:#e6261f;--okbg:light-dark(#e3f6ec,#0f2a1d);--ngbg:light-dark(#fdeceb,#33191a);--acc:#0a5cff;--warn:light-dark(#fff4d6,#2e2612)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 Figtree,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px max(16px,4vw)}
.top h1{font-size:18px;font-weight:800;margin:0;flex:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:none;color:var(--acc);font-weight:600;padding:8px 4px;min-height:44px}
.pill{font-size:13px;color:var(--sub);white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding:16px max(16px,4vw)}
h2{font-size:clamp(26px,5vw,36px);line-height:1.1;letter-spacing:-.02em;margin:4px 0 10px;font-weight:800;text-wrap:balance}
h3{font-size:18px;margin:18px 0 6px}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:999px;border:2px solid var(--ink);background:var(--bg);font-weight:700;font-size:15px}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-width:1.5px}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{border:0;background:none;padding:8px 2px 10px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
nav.tabs button.on{color:var(--ink);font-weight:800}
nav.tabs button.on svg{stroke:var(--acc)}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* map */
.home{display:grid;gap:16px}
@media(min-width:900px){.home{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
.mapbox{background:var(--soft);border-radius:18px;padding:8px 6px 2px}
.mapbox svg{display:block;width:100%;height:auto}
.st{cursor:pointer}
.st:focus{outline:none}
.st:focus-visible .ringbg{stroke:var(--acc)}
.mlabel{font:800 13px Figtree,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--soft);stroke-width:5px;stroke-linejoin:round}
.mpct{font:600 12.5px Figtree,sans-serif;fill:var(--sub);paint-order:stroke;stroke:var(--soft);stroke-width:5px;stroke-linejoin:round}
.next{border-radius:16px;padding:16px;color:#fff;margin-bottom:12px}
.next .k{font-size:13px;opacity:.9}
.next b{display:block;font-size:22px;line-height:1.25;margin:2px 0 10px}
.next .btn{border-color:#fff;background:#fff;color:#111}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.fg{background:var(--soft);border-radius:12px;padding:10px 12px}
.fg b{display:block;font-size:clamp(22px,5vw,28px);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.fg span{font-size:13px;color:var(--sub)}
.drow{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;min-height:52px}
.drow i{width:14px;height:14px;border-radius:50%}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;border-radius:4px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px;color:var(--sub)}
/* line view */
.band{color:#fff;border-radius:18px;padding:18px 18px 16px;margin-bottom:14px}
.band h2{color:#fff;margin:0 0 4px}
.band .sub{color:rgba(255,255,255,.88)}
.stations{position:relative;padding-left:4px}
.stn{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;width:100%;text-align:left;background:none;border:0;padding:0;position:relative}
.stn .rail{position:relative;display:flex;justify-content:center}
.stn .rail:before{content:"";position:absolute;top:0;bottom:0;width:10px;background:var(--c)}
.stn:first-child .rail:before{top:22px}.stn:last-child .rail:before{bottom:calc(100% - 22px)}
.stn .dot{position:relative;margin-top:10px;width:26px;height:26px;border-radius:50%;background:var(--bg);border:5px solid var(--ink)}
.stn .dot.half{background:linear-gradient(90deg,var(--c) 50%,var(--bg) 50%)}
.stn .dot.full{background:var(--c)}
.stn .tx{padding:10px 0 16px;border-bottom:1px solid var(--line)}
.stn .tx b{font-size:16.5px;display:block;line-height:1.35}
.stn .tx small{display:block;color:var(--sub);font-size:13.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* lesson deck */
.deckhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.deckhead .chip{color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.deck{position:relative;touch-action:pan-y}
.lcard{background:var(--card);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:16px;padding:18px;min-height:300px;animation:slide .25s ease}
.lcard.rev{animation-name:slideR}
@keyframes slide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.lcard{animation:none}.pkt{transition:none!important}}
.lcard h3:first-child{margin-top:0}
.lcard h3{font-size:20px;padding-left:12px;border-left:6px solid var(--c);line-height:1.3}
.big1{font-size:19px;line-height:1.75}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.dots button{width:12px;height:12px;border-radius:50%;border:0;background:var(--line);padding:0}
.dots button.on{background:var(--c);width:28px;border-radius:6px}
.decknav{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.lbody table,.qbox table{border-collapse:collapse;width:100%;font-size:14.5px;margin:8px 0}
.lbody td,.lbody th{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.lbody th{background:var(--soft)}
.scroll{overflow-x:auto}
pre{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;margin:8px 0}
code{font:13.5px ui-monospace,Menlo,monospace;background:var(--soft);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.point,.pt{background:var(--warn);border-radius:10px;padding:10px 12px;margin:10px 0}
.lbody ul,.lbody ol{padding-left:22px}
.dg{width:100%;max-width:520px;height:auto;display:block;margin:8px auto 12px;color:var(--ink)}
.dg .b1{fill:light-dark(#e6efff,#132447);stroke:#0a5cff}.dg .b2{fill:light-dark(#e3f6ec,#0f2a1d);stroke:#00a05a}.dg .b3{fill:light-dark(#fff3dc,#33270e);stroke:#e08a00}.dg .b4{fill:light-dark(#efe6ff,#24173f);stroke:#8a3ffc}.dg .zone{fill:none;stroke:#0a5cff;stroke-dasharray:4 3}.dg .zone2{fill:none;stroke:#8a3ffc;stroke-dasharray:4 3}
.t{border-bottom:2px dotted var(--acc);cursor:pointer}
/* quiz */
.qtop{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13.5px;color:var(--sub)}
.qtop .chip{color:#fff;border-radius:999px;padding:1px 10px;font-weight:700;font-size:12.5px;white-space:nowrap}
.qbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.qbar i{display:block;height:100%}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.qt{font-size:17px;font-weight:700;line-height:1.6;margin-bottom:12px}
.pl{white-space:pre-line}
.exh{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 12px}
.exh .h{font-size:13px;font-weight:700;padding:6px 10px;background:var(--soft)}
.exh pre{margin:0;border:0;border-radius:0;white-space:pre}
.opt{display:block;width:100%;text-align:left;margin:0 0 8px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:15.5px;line-height:1.5;min-height:48px}
.opt.sel{border-color:var(--acc);background:light-dark(#e6efff,#132447)}
.opt.ok{border:3px solid var(--ok);background:var(--okbg)}
.opt.ng{border:3px dashed var(--ng);background:var(--ngbg)}
.opt.ok:before,.opt.ng:before{display:block;font-size:12.5px;font-weight:800;margin-bottom:2px}
.opt.ok:before{content:"正解";color:var(--ok)}.opt.ng:before{content:"あなたの答え";color:var(--ng)}
.fin .opt:not(.ok):not(.ng){opacity:.45}
.srow{border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.srow .l{font-weight:700;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chp{border:1.5px solid var(--sub);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;min-height:38px;text-align:left}
.chp.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chp.used{opacity:.35}
.srow.ok{border:3px solid var(--ok);background:var(--okbg)}.srow.ng{border:3px dashed var(--ng);background:var(--ngbg)}
.srow .fix{font-size:13.5px;margin-top:6px;font-weight:700;color:var(--ok)}
.seq{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.seq .chp{display:flex;gap:8px;align-items:center;border-color:var(--acc)}
.seq .chp em{font-style:normal;font-weight:800;color:var(--acc)}
.res{display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px 14px;margin:12px 0 10px;font-size:20px;font-weight:800}
.res.ok{background:var(--okbg);color:var(--ok)}.res.ng{background:var(--ngbg);color:var(--ng)}
.res .mk{width:40px;height:40px;flex:none}
.ex{font-size:15.5px;line-height:1.75}
.memo{background:var(--warn);border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:700}
.memo:before{content:"覚え方";display:block;font-size:12.5px;color:var(--sub);font-weight:800}
.ans{background:var(--soft);border-radius:12px;padding:12px;margin-top:10px;white-space:pre-wrap;font-size:15px}
/* menu */
.grid2{display:grid;gap:12px}
@media(min-width:760px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.strip{display:grid;grid-template-columns:repeat(54,minmax(0,1fr));gap:2px;margin:10px 0}
.strip i{aspect-ratio:1;border-radius:1px;background:var(--line);opacity:.35}
.strip i.in{opacity:1;background:light-dark(#b9cdfa,#2a4170)}
.inp{border:1.5px solid var(--sub);border-radius:10px;padding:8px 10px;background:var(--card);font-size:16px;min-height:44px}
.inp.n{width:84px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:8px 14px;min-height:40px;font-size:14px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--bg)}
.tile{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:88px}
.tile svg{width:72px;height:56px}
.tile b{font-size:17px;display:block}
.tile small{color:var(--sub);font-size:13.5px;line-height:1.45;display:block}
/* review map */
.qmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(11px,1fr));gap:3px;margin:6px 0 14px}
.qmap button{aspect-ratio:1;border:0;border-radius:2px;padding:0;background:var(--line)}
.qmap button.w{background:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--sub);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:4px}
/* tools */
.toolfig{background:var(--soft);border-radius:16px;padding:8px}
.toolfig svg{display:block;width:100%;height:auto}
.frame{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:10px 0}
.frame div{border-radius:8px;padding:6px 6px;background:var(--soft);font-size:12.5px;line-height:1.35;border:2px solid transparent}
.frame div b{display:block;font:600 13px ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.frame div.chg{border-color:#ff8a00;background:light-dark(#fff1de,#33240f)}
@media(max-width:520px){.frame{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rt{border-collapse:collapse;width:100%;font:13.5px/1.4 ui-monospace,Menlo,monospace}
.rt td{padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.rt tr.out td{opacity:.3;text-decoration:line-through}
.rt tr.cand td{background:light-dark(#e6efff,#132447)}
.rt tr.win td{background:var(--okbg);font-weight:700}
.rt tr.win td:first-child{box-shadow:inset 6px 0 0 var(--ok)}
.sbar{display:flex;height:46px;margin:30px 0 26px;position:relative}
.sbar div:first-child{border-radius:8px 0 0 8px}.sbar div:last-of-type{border-radius:0 8px 8px 0}
.sbar div{border-right:1px solid var(--bg);background:light-dark(#cddcff,#203566)}
.sbar div:nth-child(2n){background:light-dark(#e6eeff,#172747)}
.sbar div.cur{background:var(--acc)}
.mark{position:absolute;top:-22px;transform:translateX(-50%);font:700 12.5px ui-monospace,monospace;white-space:nowrap}
.mark:after{content:"";display:block;width:2px;height:20px;background:var(--ink);margin:0 auto}
.blab{position:absolute;bottom:-20px;font:12px ui-monospace,monospace;color:var(--sub);transform:translateX(-50%);white-space:nowrap}
.bits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0}
.bits div{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:1px}
.bits span{font:700 12.5px ui-monospace,monospace;text-align:center;padding:3px 0;border-radius:3px;background:light-dark(#cddcff,#203566)}
.bits span.h{background:light-dark(#ffe6b8,#3a2c0c)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:8px}
.kv div{background:var(--soft);border-radius:10px;padding:8px 10px}
.kv span{display:block;font-size:13px;color:var(--sub)}
.kv b{font:700 16px ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.hide b{color:transparent;background:var(--line);border-radius:4px}
.term{background:#0e1116;color:#e8ecf2;border-radius:12px;padding:12px;font:14px/1.6 ui-monospace,Menlo,monospace}
.term .ln{white-space:pre-wrap;overflow-wrap:anywhere}
.term .ok{color:#5fe39a}.term .ng{color:#ff8a80}
.term .inl{display:flex;gap:6px;align-items:center}
.term input{flex:1;background:none;border:0;border-bottom:1px solid #4a5260;color:#fff;font:16px ui-monospace,Menlo,monospace;padding:4px 0;outline:none}
/* one-by-one */
.qwrap{max-width:760px;margin:0 auto}
@media(min-width:900px){.qwrap.wide{max-width:1180px}}
.mhead{margin-bottom:12px}
.dstrip{display:flex;gap:3px;height:10px;margin:8px 0 4px}
.dstrip span{border-radius:3px;overflow:hidden;background:var(--line);position:relative}
.dstrip span i{display:block;height:100%}
.dstrip span.cur{outline:2px solid var(--ink);outline-offset:1px}
.jump summary{cursor:pointer;font-size:14px;color:var(--sub);padding:6px 0;min-height:36px}
.skip{border:0;background:none;color:var(--sub);font-size:14px;text-decoration:underline;padding:8px 4px;min-height:40px}
.acts{display:grid;gap:10px;margin-top:14px}
.acts .btn{width:100%;min-height:52px;font-size:16px}
.rtag{display:inline-block;background:var(--warn);border-radius:6px;padding:1px 8px;font-size:12.5px;font-weight:700;color:var(--ink)}
.sptabs{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;margin-bottom:10px}
.sptabs button{border:0;background:none;min-height:42px;font-weight:700}
.sptabs button.on{background:var(--ink);color:var(--bg)}
.spread{display:grid;grid-auto-flow:column;grid-auto-columns:100%;gap:16px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;align-items:start}
.spread::-webkit-scrollbar{display:none}
.spread>section{scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.spread>section.card2{border-top:8px solid var(--c)}.tbmini .tbgrid{display:block}.tbmini .tbfg{margin:0 0 10px}.tbmini .tbfg svg{width:100%;height:auto;display:block}.tbmini .tbtx{padding:0}.tbmini .tbtx p{margin:0 0 8px;line-height:1.7}
.pgh{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:6px}
@media(min-width:900px){.sptabs{display:none}.spread{align-items:stretch;overflow-y:visible;grid-auto-flow:row;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;overflow:visible;box-shadow:0 10px 30px -18px rgba(0,0,0,.35);border-radius:16px}.spread>section{border-radius:16px 0 0 16px;min-height:60vh}.spread>section.card2{border-radius:0 16px 16px 0;border-top:1px solid var(--line);border-left:0;box-shadow:inset 14px 0 18px -16px rgba(0,0,0,.35);border-right:8px solid var(--c)}}
.sbar2{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;padding:10px 0;background:var(--bg);z-index:5}
.cnav{display:flex;align-items:center;gap:8px;margin-top:12px}
.corr{background:var(--okbg);border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:700}
.corr:before{content:"正解";display:block;font-size:12.5px;color:var(--ok)}
/* compact question */
.cmp .qbox{padding:12px}
.cmp .qt{font-size:15px;line-height:1.5;margin-bottom:8px}
.cmp .opt{padding:7px 10px;font-size:14px;line-height:1.45;min-height:40px;margin-bottom:6px;border-radius:10px}
.cmp .opt.ok:before,.cmp .opt.ng:before{display:inline;margin-right:6px}
.cmp .exh{margin-bottom:8px}.cmp .exh .h{padding:3px 8px;font-size:12px}.cmp .exh pre{font-size:10.5px;line-height:1.35;padding:5px 8px;max-height:34vh;overflow:auto}
main:has(.cmp){padding-top:8px}
.cmp .qt{font-size:14.5px}
.cmp .srow{padding:6px 8px;margin-bottom:6px}.cmp .srow .l{font-size:14px}.cmp .chips{margin-top:4px;gap:4px}.cmp .chp{min-height:32px;padding:3px 10px;font-size:13px}
.cmp .seq{min-height:44px;padding:6px}
.cmp .res{font-size:15px;padding:5px 10px;margin:8px 0 0;border-radius:10px}.cmp .res .mk{width:22px;height:22px}

  {const seen=new Set();ids=ids.filter(id=>!seen.has(id)&&seen.add(id));}

    app.innerHTML=`<h2>サブネット計算ドリル</h2><p class="sub">問題は毎回ランダムに作られます。全角の数字でも答えられます。</p>
<div class="card"><div class="sub">${esc(T.t)}　今回 ${arg.sc[0]}/${arg.sc[1]} 正解</div><div class="qt" style="margin:6px 0 12px">${q.t}</div>${box}${res}</div>
<details class="card"><summary><b>出す問題の種類</b>（${f.length===SDT.length?"すべて":f.length+"種類"}）</summary><div class="row" style="flex-wrap:wrap;margin-top:10px">${SDT.map(t=>`<button class="btn sm ${f.includes(t.id)&&f.length<SDT.length?"pri":""}" data-ty="${t.id}">${esc(t.t)}</button>`).join("")}<button class="btn sm" data-ty="">すべて</button></div></details>
<div class="card"><div class="sub">これまでの成績　${tot[0]}/${tot[1]} 正解${tot[1]?`（${Math.round(tot[0]/tot[1]*100)}%）`:""}</div><div class="kv" style="margin-top:8px">${SDT.filter(t=>st[t.id]).map(t=>`<div><span>${esc(t.t)}</span><b>${Math.round(st[t.id][0]/st[t.id][1]*100)}%<small style="font-weight:400;color:var(--sub)">（${st[t.id][0]}/${st[t.id][1]}）</small></b></div>`).join("")||`<p class="sub">まだ記録がありません。</p>`}</div></div>`;
    const judge=v=>{if(arg.ans!==null)return;const a=sdNorm(v);if(!a)return;let ok;
      if(q.k==="ip"){const x=ip2n(a);ok=x!==null&&n2ip(x)===q.a;}
      else if(q.k==="cidr"){const m=a.match(/^(.+)\/(\d{1,2})$/),x=m&&ip2n(m[1]);ok=!!m&&x!==null&&`${n2ip(x)}/${+m[2]}`===q.a;}else ok=a===q.a;
      arg.ans=v;arg.ok=ok;arg.sec=Math.round((Date.now()-arg.t0)/1000);arg.sc[1]++;if(ok)arg.sc[0]++;
      const s=st[q.ty]||[0,0];s[1]++;if(ok)s[0]++;st[q.ty]=s;save();draw();};
    const nx=()=>{next();draw();const i=$("#sda");if(i)i.focus();};
    const inp=$("#sda");if(inp&&!done){inp.focus();inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();judge(inp.value);}};$("#sdc").onclick=()=>judge(inp.value);}
    app.querySelectorAll("[data-yn]").forEach(b=>b.onclick=()=>judge(b.dataset.yn));
    if(done){const n=$("#sdn");n.onclick=nx;n.focus();}
    app.querySelectorAll("[data-ty]").forEach(b=>b.onclick=()=>{const id=b.dataset.ty;let f=S.sd.f&&S.sd.f.length?S.sd.f.slice():[];
      if(!id)f=[];else if(f.includes(id))f=f.filter(x=>x!==id);else f.push(id);S.sd.f=f;save();if(!on().includes(arg.q.ty))next();draw();const d=app.querySelector("details");if(d)d.open=true;});};
  draw();
}
/* CLI */
const norm=s=>s.toLowerCase().trim().replace(/\s+/g," ").replace(/\binterface\b/g,"int").replace(/\b(gigabitethernet|gigabit|gi)\s*(?=\d)/g,"g").replace(/\bg\s+(?=\d)/g,"g");
function tCli(){
  ttl.textContent="コマンド練習";let i=arg.i??CLI.findIndex(c=>!S.cli[c.id]);if(i<0)i=0;let res=null,val="",hint=false;
  const draw=()=>{const c=CLI[i];const done=CLI.filter(x=>S.cli[x.id]).length;
    app.innerHTML=`<h2>コマンド練習</h2><div class="row" style="margin-bottom:8px"><span class="num grow">覚えた ${done}/${CLI.length}</span><span class="num">${i+1}/${CLI.length}</span></div><div class="bar" style="margin-bottom:12px"><i style="width:${done/CLI.length*100}%;background:var(--ok)"></i></div>
<div class="card"><div class="sub">やること</div><b style="font-size:19px">${esc(c.g)}</b>
<div class="term" style="margin-top:12px"><div class="inl"><span>${esc(c.p)}</span><input id="ci" value="${esc(val)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="コマンド"></div>
${res==="ok"?`<div class="ln ok">○ 正解！ ${esc(c.ans)}</div>`:res==="ng"?`<div class="ln ng">× ちがいます</div>`:""}${hint||res==="ok"?`<div class="ln">${esc(c.e)}${hint&&res!=="ok"?`\n答えの例：${esc(c.ans)}`:""}</div>`:""}</div>
<div class="row" style="margin-top:12px"><button class="btn pri" id="cc">Enter（答え合わせ）</button><button class="btn sm" id="ch">答えを見る</button><span class="grow"></span><button class="btn sm" id="cp" ${i===0?"disabled":""}>‹</button><button class="btn sm" id="cn">次 ›</button></div></div>`;
    const inp=$("#ci");if(res!=="ok")inp.focus();
    const check=()=>{val=inp.value;const ok=new RegExp(c.re).test(norm(val));res=ok?"ok":"ng";if(ok){S.cli[c.id]=1;save();}draw();};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check();}};
    $("#cc").onclick=check;$("#ch").onclick=()=>{hint=true;val=inp.value;draw();};
    const mv=d=>{i=(i+d+CLI.length)%CLI.length;arg.i=i;res=null;val="";hint=false;draw();};
    $("#cp").onclick=()=>mv(-1);$("#cn").onclick=()=>mv(1);};
  draw();
}
function tLab(){
  if(arg.lab===undefined){ttl.textContent="シナリオ演習";
    app.innerHTML=`<h2>シナリオ演習</h2><p class="sub">設定の流れを、最初から最後まで打ち込みます。</p>${LABS.map((b,k)=>`<button class="card" data-k="${k}" style="display:block;width:100%;text-align:left"><div class="row"><b class="grow" style="font-size:17px">${esc(b.t)}</b><span class="num">${S.lab[b.id]?"クリア ✓":b.s.length+"手順"}</span></div><div class="sub pl">${esc(b.g.split("\n")[0])}</div></button>`).join("")}`;
    app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>go("tool",{t:"lab",lab:+b.dataset.k,step:0,log:[]}));return;}
  const B=LABS[arg.lab];ttl.textContent=B.t;let miss=0,show=false;
  const draw=()=>{const st=arg.step,fin=st>=B.s.length,s=B.s[st];
    app.innerHTML=`<h2>${esc(B.t)}</h2><div class="card"><div class="sub">目標</div><div class="pl" style="font-weight:600">${esc(B.g)}</div></div>
<div class="bar" style="margin-bottom:10px"><i style="width:${st/B.s.length*100}%;background:var(--ok)"></i></div>
<div class="term">${arg.log.map(l=>`<div class="ln">${esc(l)}</div>`).join("")}${fin?`<div class="ln ok">○ すべての手順が完了しました！</div><div class="ln">${esc(B.e)}</div>`:`<div class="sub" style="color:#9aa4b2">次：${esc(s.h)}</div><div class="inl"><span>${esc(s.p)}</span><input id="li" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="コマンド"></div>${miss?`<div class="ln ng">× ちがいます${show?"　答えの例："+esc(s.ans):""}</div>`:""}`}</div>
<div class="row" style="margin-top:12px">${fin?`<button class="btn pri" id="lagain">もう一度</button>`:`<button class="btn pri" id="lc">Enter</button><button class="btn sm" id="lh">答えを見る</button>`}</div>`;
    if(fin){S.lab[B.id]=1;save();$("#lagain").onclick=()=>{arg.step=0;arg.log=[];miss=0;show=false;draw();};return;}
    const inp=$("#li");inp.focus();
    const check=()=>{if(new RegExp(s.re).test(norm(inp.value))){arg.log.push(s.p+" "+inp.value.trim());arg.step++;miss=0;show=false;}else miss++;draw();};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check();}};$("#lc").onclick=check;$("#lh").onclick=()=>{miss=Math.max(1,miss);show=true;draw();};};
  draw();
}
/* ---------- boot ---------- */
async function boot(){
  try{const r=await fetch("data.json",{cache:"no-cache"});const A=await r.json();
    A.forEach(o=>{if(o.r==="D")DOM.push(o);else if(o.r==="L")LES.push(o);else if(o.r==="Q")QS.push(o);else if(o.r==="G")GL.push(o);else if(o.r==="C")CLI.push(o);else if(o.r==="B")LABS.push(o);else if(o.r==="O")ORDER=o.ids;else if(o.r==="TB")TBS.push(o);else if(o.r==="CP")CP=o.list;else if(o.r==="QP")QP=o.m;else if(o.r==="RG")RG=o.list;});
  }catch(e){app.innerHTML=`<p class="empty">データを読み込めませんでした。ページを開き直してください。</p>`;return;}
  DOM.forEach(d=>DM[d.id]=d);LES.forEach(l=>LM[l.id]=l);QS.forEach(q=>QM[q.id]=q);buildGloss();
  ORDER=ORDER.filter(id=>QM[id]);{const g={};QS.forEach(q=>{const k=strip(q.t).replace(/\s+/g,"");(g[k]=g[k]||[]).push(q);});Object.values(g).forEach(a=>{if(a.length>1)a.forEach(q=>q.sim=a.length);});}for(const k in RAWDS){const nk=k.replace(/^ng:/,"ng_");const ss=unpackSess(nk,RAWDS[k]);if(ss)S.ds[skey(ss.dom,ss.ng)]=ss;}ORDER.forEach(id=>{const l=QM[id].lt;(MAINBY[l]=MAINBY[l]||[]).push(id);});const h=location.hash.slice(1);view=TOP.includes(h)?h:"course";render();
  try{if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);if(!db||!user)return;
    const id=await user.id();if(!id)return;const col=db.collection("data/users/"+id);const rP=col.doc("progress2"),rS=col.doc("sessions"),rOld=col.doc("progress");
    const TO=p=>Promise.race([p,new Promise(r=>setTimeout(()=>r("TO"),10000))]);
    const dat=x=>x&&typeof x.data==="function"?x.data():x;
    const pull=async(first)=>{
    let [p2,s2]=await Promise.all([TO(rP.get()),TO(rS.get())]);if(p2==="TO"||s2==="TO")return false;p2=dat(p2);s2=dat(s2);
    if(!p2&&first){const o=dat(await TO(rOld.get()));if(o&&o!=="TO"&&o.st){p2={st:o.st,opt:o.opt,cli:o.cli,lab:o.lab,last:o.last};if(!s2&&o.ds)s2={ds:o.ds};}}
    if(p2&&p2.st){const rst=unpackSt(p2.st);for(const k in rst){const a=S.st[k],b=rst[k];if(!a||((b.c||0)+(b.w||0))>((a.c||0)+(a.w||0)))S.st[k]=Object.assign({},b,a&&a.m?{m:a.m}:{});}
      ["cli","lab"].forEach(k=>{if(p2[k])S[k]=Object.assign({},p2[k],S[k]);});if(p2.last&&!S.last)S.last=p2.last;if(p2.opt)S.opt=p2.opt;if(p2.cls&&p2.clsv===2)S.cls=Object.assign({},p2.cls,S.cls||{});if(p2.rate&&!S.rate)S.rate=p2.rate;
      if(p2.mxh&&p2.mxh.length){const m={};(S.mxh||[]).concat(p2.mxh).forEach(h=>m[h.id]=h);S.mxh=Object.values(m).sort((a,b)=>b.end-a.end).slice(0,20);}
      if(p2.sd&&p2.sd.s){S.sd=S.sd||{};S.sd.s=S.sd.s||{};for(const k in p2.sd.s){const a=S.sd.s[k],b=p2.sd.s[k];if(!a||b[1]>a[1])S.sd.s[k]=b;}if(!S.sd.f&&p2.sd.f)S.sd.f=p2.sd.f;}}
    {const fin=new Set((S.mxh||[]).map(h=>h.id)),r=s2&&s2.mx;if(S.mx&&fin.has(S.mx.id)&&view!=="examq")S.mx=null;/* ほかの端末で採点済み */
      if(r&&r.ids&&!fin.has(r.id)&&view!=="examq"&&(!S.mx||r.id>S.mx.id||(r.id===S.mx.id&&r.i>S.mx.i)))S.mx=Object.assign({},r,{_t:0});}
    if(s2&&s2.ds)for(const k in s2.ds){const b=unpackSess(k.replace(/^ng:/,"ng_"),s2.ds[k]);if(!b)continue;const kk=skey(b.dom,b.ng),a=S.ds[kk];if(!a||(b.i>(a.i||0)&&!(view==="play"&&arg===a)))S.ds[kk]=b;}
      return true;};
    if(!(await pull(true)))return;
    let lastPull=Date.now();document.addEventListener("visibilitychange",async()=>{if(document.hidden||Date.now()-lastPull<5000)return;lastPull=Date.now();if(saving)return;
      try{const v0=JSON.stringify(packAll());if(await pull(false)){if(JSON.stringify(packAll())!==v0){save();if(view!=="play"&&view!=="class")render();}}}catch(e){}});
    dbP=rP;dbS=rS;save();flush();if(["one","course","line","side","review"].includes(view))render();
  }catch(e){}
}
boot();
}
